name: Verify MVP
on:
  pull_request:
  push:
    branches: [main, feat/mvp-foundation]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: halqa
          POSTGRES_PASSWORD: halqa
          POSTGRES_DB: halqa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://halqa:halqa@localhost:5432/halqa_test
      TEST_DATABASE_URL: postgresql://halqa:halqa@localhost:5432/halqa_test
      AUTH_SECRET: ci-test-only-secret-at-least-32-characters
      APP_URL: http://localhost:3000
      APP_TIMEZONE: Europe/Istanbul
      SEED_TEACHER_CODE: "729416" # Disposable CI database only.
      ALLOW_SMOKE_MUTATIONS: "true"
      HALQA_TEST_CLOCK: "2026-10-29T09:00:00Z"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run db:seed
      - name: Start production server for mobile smoke test
        run: |
          mkdir -p work/smoke
          npm run start:test > work/server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat work/server.log
          exit 1
      - run: npm run test:browser
      - name: Save mobile screenshots and sample PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-and-pdf-preview
          path: |
            work/smoke/
            work/server.log
          retention-days: 7
